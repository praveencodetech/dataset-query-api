# Production profile: PostgreSQL on Render / Cloud
# DataSource is configured dynamically via ProdDataSourceConfig reading DATABASE_URL.
# Never hardcode credentials here; use environment variables on the platform.

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable JPA open-session-in-view anti-pattern
spring.jpa.open-in-view=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Actuator: expose only the health endpoint for Render health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
