spring.application.name=dataset-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Cloud and platform port configuration
server.port=${PORT:8080}

# Actuator: enable only /actuator/health for cloud platform health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# OpenAPI 3 / Swagger UI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Optional demo sample data seeding (overridable via SEED_SAMPLE_DATA env var)
seed.sample.data=false
